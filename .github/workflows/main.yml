name: Build APK e Testes de Regressão

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ./gather
        run: flutter pub get

      # ==================================================
      # AQUI ESTÁ O SEU TESTE DE REGRESSÃO (CAIXA BRANCA E INTEGRAÇÃO)
      # ==================================================
      - name: Validar Regressão (Testes)
        working-directory: ./gather
        run: flutter test

      - name: Build APK
        working-directory: ./gather
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ./gather/build/app/outputs/flutter-apk/app-debug.apk