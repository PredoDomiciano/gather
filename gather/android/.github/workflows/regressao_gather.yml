name: Testes de Regressão - Gather

# O robô vai rodar sempre que você fizer um push para a branch main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  testes-automatizados:
    name: Executar Caixa Branca e Integração
    runs-on: ubuntu-latest

    steps:
      # 1. O robô baixa o seu código do repositório
      - name: Clonar o repositório
        uses: actions/checkout@v4

      # 2. Instala o Flutter na máquina virtual do GitHub
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Baixa as dependências do pubspec.yaml
      - name: Instalar Dependências (pub get)
        run: flutter pub get

      # 4. Roda todos os arquivos dentro da pasta 'test'
      - name: Validar Regressão (Testes)
        run: flutter test